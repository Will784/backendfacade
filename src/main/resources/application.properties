spring.application.name=hotel-reservations

# Render injects the PORT variable; 8080 is used locally.
server.port=${PORT:8080}

# Never expose internal details (stack traces, exception names) to clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Security settings (override them with environment variables in production).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.timezone=${APP_TIMEZONE:America/Bogota}

# Login protection: temporary lock after several failed attempts.
app.login.max-attempts=5
app.login.lock-minutes=5

logging.level.root=INFO
